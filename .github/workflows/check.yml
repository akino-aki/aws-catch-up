# 記事の形と公開のルールを確認する。
# main のブランチ保護で必須チェックにしているので、これが失敗すると main にマージできない。
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [work]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 収集のコミットを調べるため、履歴をすべて取ってくる
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 記事の一覧
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-articles.js | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: 記事の形がテンプレートどおりか
        run: node scripts/check-articles.js --lint
      - name: 収集したばかりの下書きの ✍️ 欄が空か
        if: github.event_name == 'push'
        run: node scripts/check-collect.js "${{ github.event.before }}" "${{ github.sha }}"
      - name: 公開のルールに反する記事がないか
        run: node scripts/check-articles.js --guard
